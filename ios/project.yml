name: HealthBridge
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  HealthBridge:
    type: application
    platform: iOS
    sources: [HealthBridge]
    entitlements:
      path: HealthBridge/HealthBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: HealthBridge/Info.plist
      properties:
        CFBundleDisplayName: HealthBridge
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Reads activity, heart rate, HRV, sleep, blood oxygen, respiratory rate, VO2 max, blood pressure, weight, workouts, water, time in daylight and logged moods, and sends them encrypted to your own Mac only.
        NSHealthUpdateUsageDescription: Saves a glass of water to Apple Health when you use the Log water shortcut.
        NSLocalNetworkUsageDescription: Sends your encrypted health data to your own Mac on the same Wi-Fi.
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
