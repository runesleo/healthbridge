name: HealthBridge
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  HealthBridge:
    type: application
    platform: iOS
    sources: [HealthBridge]
    dependencies:
      - target: HealthBridgeWatch
    entitlements:
      path: HealthBridge/HealthBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: HealthBridge/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: HealthBridge
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Reads activity, workout distance, heart rate, HRV, sleep, blood oxygen, respiratory rate, VO2 max, blood pressure, weight, workouts, water, time in daylight and logged moods, and sends them encrypted to your own Mac only.
        NSHealthUpdateUsageDescription: Saves the water and moods you log on the Today screen to Apple Health.
        NSCameraUsageDescription: Takes a photo of your meal when you tap Take a photo.
        NSPhotoLibraryAddUsageDescription: Saves meal photos to your Photos library so your Mac can tell when you ate.
        NSSpeechRecognitionUsageDescription: Turns the voice notes you record on Apple Watch into text, on this iPhone.
        NSLocalNetworkUsageDescription: Sends your encrypted health data to your own Mac on the same Wi-Fi.
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HealthBridgeWatch:
    type: application
    platform: watchOS
    sources: [HealthBridgeWatch]
    dependencies:
      - target: HealthBridgeWatchWidget
    info:
      path: HealthBridgeWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: HealthBridge
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER:base)
        NSMicrophoneUsageDescription: Records the voice note you start, so your iPhone can turn it into text.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [healthbridge]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HealthBridgeWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [HealthBridgeWatchWidget]
    info:
      path: HealthBridgeWatchWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: HealthBridge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).watchkitapp.widget
